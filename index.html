<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050505">
    <meta name="description" content="Galeria Visual Exclusiva">
    <title>Galeria da Yas | Portfolio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Paleta de Cores "Dark Luxury" */
            --bg-deep: #050505;
            --bg-gradient: radial-gradient(circle at 50% 0%, #1a1a1a, #050505 60%);
            
            --glass-surface: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            
            --text-primary: #ffffff;
            --text-secondary: #999999;
            
            /* Animações Físicas */
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* RESET & BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-deep);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Scrollbar Premium */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        /* HEADER CINEMATOGRÁFICO */
        header {
            padding: 100px 20px 60px;
            text-align: center;
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 50%; transform: translateX(-50%);
            width: 60px; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 6vw, 4.5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(180deg, #fff 0%, #ccc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            opacity: 0;
            animation: textReveal 1.2s var(--ease-out-expo) forwards;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0;
            animation: textReveal 1.2s var(--ease-out-expo) 0.2s forwards;
        }

        /* SEÇÕES & LAYOUT */
        section {
            max-width: 1280px;
            margin: 0 auto 80px;
            padding: 0 24px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .section-line {
            height: 1px;
            width: 100%;
            background: linear-gradient(90deg, var(--glass-border), transparent);
        }

        /* GRID (Mantendo a estrutura solicitada) */
        .gallery-grid {
            display: grid;
            /* Lógica: Mínimo de 210px, preenchendo o espaço disponível */
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); 
            gap: 20px;
        }

        /* CARD DESIGN PROFISSIONAL */
        .media-card {
            position: relative;
            height: 280px; /* Tamanho fixo solicitado */
            border-radius: 4px; /* Bordas levemente menos arredondadas para ar profissional */
            background: var(--glass-surface);
            border: 1px solid var(--glass-border);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s var(--ease-out-expo);
            
            /* Estado inicial para animação */
            opacity: 0;
            transform: translateY(30px);
        }

        /* Hover Effect: Glow & Lift */
        .media-card:hover {
            transform: translateY(-6px);
            border-color: var(--glass-highlight);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(255,255,255,0.05);
            z-index: 2;
        }

        .media-card img, .media-card video {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.7s ease;
            filter: brightness(0.9) contrast(1.1); /* Tratamento de imagem sutil */
        }

        .media-card:hover img, .media-card:hover video {
            transform: scale(1.05);
            filter: brightness(1) contrast(1);
        }

        /* Efeito de Loading Elegante */
        .media-card.loading {
            background: #0f0f0f;
        }
        .media-card.loading::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: translateX(-100%);
            animation: shimmer 1.5s infinite;
        }
        
        .media-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Ícone de Vídeo Premium */
        .video-badge {
            position: absolute;
            top: 12px; right: 12px;
            width: 32px; height: 32px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        
        .video-badge svg { width: 10px; height: 10px; fill: white; margin-left: 2px; }
        
        .media-card:hover .video-badge {
            background: rgba(255,255,255,0.95);
        }
        .media-card:hover .video-badge svg { fill: black; }

        /* LIGHTBOX / MODAL */
        .lightbox {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85); /* Fundo escuro */
            backdrop-filter: blur(20px); /* Blur pesado estilo iOS */
            z-index: 2000;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease;
        }
        
        .lightbox.active { opacity: 1; pointer-events: all; }

        .lightbox-wrapper {
            position: relative;
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }

        .lightbox-media {
            max-width: 90vw; max-height: 85vh;
            border-radius: 4px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            opacity: 0; transform: scale(0.95);
            transition: opacity 0.4s ease, transform 0.4s var(--ease-out-expo);
        }
        
        .lightbox-media.show { opacity: 1; transform: scale(1); }
        .lightbox-media.zoomed { transform: scale(1.8); cursor: grab; }

        /* CONTROLES DE NAVEGAÇÃO CUSTOMIZADOS */
        .nav-btn {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            width: 56px; height: 56px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
            z-index: 2100;
            color: white;
        }

        .nav-btn:hover {
            background: white;
            color: black;
            transform: translateY(-50%) scale(1.1);
        }

        .btn-prev { left: 40px; }
        .btn-next { right: 40px; }
        .btn-close { 
            top: 30px; right: 30px; 
            transform: none;
            width: 44px; height: 44px;
            background: transparent; border-color: transparent;
        }
        .btn-close:hover { background: rgba(255,255,255,0.1); color: white; transform: rotate(90deg); }

        /* KEYFRAMES */
        @keyframes textReveal { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shimmer { 100% { transform: translateX(100%); } }

        /* RESPONSIVIDADE */
        @media (max-width: 768px) {
            header { padding-top: 60px; }
            header h1 { font-size: 2.5rem; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .media-card { height: 200px; /* Ajuste proporcional para mobile */ }
            
            .nav-btn { width: 44px; height: 44px; background: rgba(0,0,0,0.5); border: none; }
            .btn-prev { left: 10px; }
            .btn-next { right: 10px; }
            .btn-close { top: 20px; right: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Galeria da Yas</h1>
        <p>Coleção Visual</p>
    </header>

    <main>
        <section>
            <div class="section-header">
                <span class="section-title">Fotos</span>
                <div class="section-line"></div>
            </div>
            
            <div class="gallery-grid">
                <div class="media-card loading" data-type="image" data-src="Yasmi.jpg"><img src="" alt="" loading="lazy"></div>
                <div class="media-card loading" data-type="image" data-src="yasmi2.jpg"><img src="" alt="" loading="lazy"></div>
                <div class="media-card loading" data-type="image" data-src="yasmi3.jpg"><img src="" alt="" loading="lazy"></div>

                <div class="media-card loading" data-type="image" data-src="yasmi5.jpg"><img src="" alt="" loading="lazy"></div>
                <div class="media-card loading" data-type="image" data-src="yasmi6.jpg"><img src="" alt="" loading="lazy"></div>
                <div class="media-card loading" data-type="image" data-src="yasmi7.jpg"><img src="" alt="" loading="lazy"></div>

                <div class="media-card loading" data-type="image" data-src="yasmi14.jpg"><img src="" alt="" loading="lazy"></div>

        <section>
            <div class="section-header">

            <div class="gallery-grid">
                <div class="media-card loading" data-type="video" data-src="video1.mp4">

                    <video src="" muted loop playsinline></video>
                    <div class="video-badge"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
                </div>
                <div class="media-card loading" data-type="video" data-src="video3.mp4">
                    <video src="" muted loop playsinline></video>
                    <div class="video-badge"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
                </div>
                <div class="media-card loading" data-type="video" data-src="video4.mp4">
                    <video src="" muted loop playsinline></video>
                    <div class="video-badge"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
                </div>
                <div class="media-card loading" data-type="video" data-src="video5.mp4">
                    <video src="" muted loop playsinline></video>
                    <div class="video-badge"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
                </div>
                <div class="media-card loading" data-type="video" data-src="video6.mp4">
                    <video src="" muted loop playsinline></video>
                    <div class="video-badge"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
                </div>
                <div class="media-card loading" data-type="video" data-src="video7.mp4">
                    <video src="" muted loop playsinline></video>

                </div>

    </main>

    <div id="lightbox" class="lightbox">
        <button class="nav-btn btn-close">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        
        <button class="nav-btn btn-prev">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        
        <div class="lightbox-wrapper">
            </div>
        
        <button class="nav-btn btn-next">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.media-card');
            const lightbox = document.getElementById('lightbox');
            const wrapper = lightbox.querySelector('.lightbox-wrapper');
            const closeBtn = lightbox.querySelector('.btn-close');
            const prevBtn = lightbox.querySelector('.btn-prev');
            const nextBtn = lightbox.querySelector('.btn-next');
            
            let currentIndex = 0;
            let isZoomed = false;
            let touchStartX = 0;

            // 1. LAZY LOADING AVANÇADO COM ANIMAÇÃO DE ENTRADA
            const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach((entry, i) => {
                    if (entry.isIntersecting) {
                        const card = entry.target;
                        const src = card.getAttribute('data-src');
                        const media = card.querySelector('img, video');
                        
                        // Pequeno delay baseado no índice para efeito cascata
                        setTimeout(() => {
                            if (media) {
                                media.src = src;
                                const reveal = () => {
                                    card.classList.remove('loading');
                                    media.classList.add('loaded');
                                    card.classList.add('visible');
                                };

                                if (media.tagName === 'VIDEO') {
                                    media.onloadeddata = reveal;
                                    card.addEventListener('mouseenter', () => media.play().catch(() => {}));
                                    card.addEventListener('mouseleave', () => { media.pause(); media.currentTime = 0; });
                                } else {
                                    media.onload = reveal;
                                }
                            }
                        }, i * 50); // Delay escalonado
                        
                        obs.unobserve(card);
                    }
                });
            }, { rootMargin: '50px', threshold: 0.1 });

            cards.forEach(card => observer.observe(card));

            // 2. LÓGICA DO LIGHTBOX
            cards.forEach((card, index) => {
                card.addEventListener('click', () => openLightbox(index));
            });

            function openLightbox(index) {
                currentIndex = index;
                renderContent();
                lightbox.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                lightbox.classList.remove('active');
                document.body.style.overflow = '';
                setTimeout(() => { wrapper.innerHTML = ''; }, 300); // Limpa após animação
                isZoomed = false;
            }

            function renderContent() {
                const card = cards[currentIndex];
                const type = card.getAttribute('data-type');
                const src = card.getAttribute('data-src');
                
                // Limpa conteúdo anterior
                wrapper.innerHTML = '';
                isZoomed = false;

                let el;
                if (type === 'image') {
                    el = document.createElement('img');
                    el.src = src;
                    el.onclick = (e) => { e.stopPropagation(); toggleZoom(el); };
                } else {
                    el = document.createElement('video');
                    el.src = src;
                    el.controls = true;
                    el.autoplay = true;
                }
                
                el.classList.add('lightbox-media');
                wrapper.appendChild(el);
                
                // Força reflow para animação
                requestAnimationFrame(() => el.classList.add('show'));
            }

            function toggleZoom(el) {
                isZoomed = !isZoomed;
                el.classList.toggle('zoomed', isZoomed);
            }

            function navigate(step) {
                const currentMedia = wrapper.querySelector('.lightbox-media');
                if(currentMedia) currentMedia.classList.remove('show');
                
                setTimeout(() => {
                    currentIndex = (currentIndex + step + cards.length) % cards.length;
                    renderContent();
                }, 200);
            }

            // EVENT LISTENERS
            closeBtn.onclick = closeLightbox;
            prevBtn.onclick = (e) => { e.stopPropagation(); navigate(-1); };
            nextBtn.onclick = (e) => { e.stopPropagation(); navigate(1); };
            
            lightbox.onclick = (e) => {
                if (e.target === lightbox || e.target === wrapper) closeLightbox();
            };

            // TECLADO
            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('active')) return;
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') navigate(-1);
                if (e.key === 'ArrowRight') navigate(1);
            });

            // SWIPE MOBILE
            lightbox.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX, {passive: true});
            lightbox.addEventListener('touchend', e => {
                if (isZoomed) return;
                const touchEndX = e.changedTouches[0].screenX;
                if (touchEndX < touchStartX - 50) navigate(1);
                if (touchEndX > touchStartX + 50) navigate(-1);
            }, {passive: true});
        });
    </script>
</body>
</html>
